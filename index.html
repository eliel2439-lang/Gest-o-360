<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gestão 360° · Financeiro & Projetos</title>
<style>
:root{--bg:#090b10;--surface:#121722;--surface2:#19202c;--surface3:#222b39;--border:#293241;--text:#eef1f5;--muted:#929baa;--faint:#626d7d;--gold:#d9a94e;--gold2:#8a6b2e;--green:#4ade80;--red:#f87171;--yellow:#fbbf24;--blue:#60a5fa;--violet:#a78bfa;--sidebar:238px;--radius:13px}
:root{--sidebar:236px}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;-webkit-font-smoothing:antialiased}button{font:inherit}
#g360-lock{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
#g360-lock .box{width:min(360px,100%);background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px 24px;text-align:center}
#g360-lock .brand{font-size:17px;font-weight:900;letter-spacing:-.03em;margin-bottom:2px}
#g360-lock .sub{font-size:10px;color:var(--gold);font-weight:800;margin-bottom:22px}
#g360-lock .field{position:relative;text-align:left;margin-bottom:12px}
#g360-lock input{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:12px 42px 12px 14px;font-size:14px;letter-spacing:2px}
#g360-lock .toggle-eye{position:absolute;right:6px;top:6px;bottom:6px;width:32px;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:14px}
#g360-lock button.enter{width:100%;background:var(--gold);color:#191207;border:0;border-radius:10px;padding:12px;font-weight:900;font-size:12px;cursor:pointer;margin-top:4px}
#g360-lock .err{color:var(--red);font-size:10.5px;margin-top:10px;min-height:14px}
.app.g360-hidden{display:none}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sidebar);background:#0d1119;border-right:1px solid var(--border);z-index:60;padding:14px 10px;display:flex;flex-direction:column}
.brand{padding:10px 10px 15px;border-bottom:1px solid var(--border);margin-bottom:10px}.brand strong{font-size:17px;letter-spacing:-.03em;white-space:nowrap}.brand span{display:block;color:var(--gold);font-size:10px;font-weight:800;margin-top:3px}
.side-btn{border:0;width:100%;display:flex;align-items:center;gap:9px;background:transparent;color:var(--muted);border-radius:9px;padding:10px;cursor:pointer;text-align:left;font-size:12px;font-weight:750;margin:2px 0}.side-btn:hover{background:var(--surface2);color:var(--text)}.side-btn.active{background:rgba(217,169,78,.11);color:var(--gold)}.side-btn .ico{width:19px;text-align:center;font-size:15px}.side-btn .badge{margin-left:auto;background:var(--surface3);padding:2px 7px;border-radius:99px;font-size:9px}
.side-foot{margin-top:auto;border-top:1px solid var(--border);padding-top:9px}
.main{margin-left:var(--sidebar);height:100vh;display:flex;flex-direction:column}
.topbar{height:56px;flex:0 0 56px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:8px 16px;background:rgba(9,11,16,.95)}
.module-title{flex:1;min-width:0}.module-title b{display:block;font-size:15px}.module-title span{font-size:10.5px;color:var(--muted)}
.save-pill{font-size:10.5px;font-weight:800;padding:5px 10px;border-radius:99px;background:var(--surface2);border:1px solid var(--border);color:var(--muted);white-space:nowrap}.save-pill.ok{color:var(--green)}.save-pill.warn{color:var(--yellow)}.save-pill.err{color:var(--red);border-color:var(--red)}
.top-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:7px 11px;font-size:11px;font-weight:750;cursor:pointer}
.frames{flex:1;position:relative;min-height:0}.native-frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#0b0d12;display:none}.native-frame.active{display:block}
.bottom-nav{display:none}
@media(max-width:760px){.sidebar{display:none}.main{margin-left:0;height:100dvh}.topbar{height:52px;flex-basis:52px;padding:6px 10px;padding-top:max(6px,env(safe-area-inset-top))}.module-title span,.top-btn .txt{display:none}
.bottom-nav{display:flex;flex:0 0 auto;background:rgba(13,17,25,.98);border-top:1px solid var(--border);padding:5px 3px calc(5px + env(safe-area-inset-bottom))}.bottom-nav button{flex:1;border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:8px;padding:6px 0;cursor:pointer}.bottom-nav button.active{background:rgba(217,169,78,.1);color:var(--gold)}.bottom-nav .ico{font-size:17px}.bottom-nav .txt{font-size:9.5px;font-weight:800}}
</style>
</head>
<body>
<div id="g360-lock">
  <div class="box">
    <div class="brand">Gestão 360° Ultra</div>
    <div class="sub">ÁREA RESTRITA</div>
    <form id="g360-lock-form">
      <div class="field">
        <input type="password" id="g360-lock-input" inputmode="text" autocomplete="off" placeholder="Senha" autofocus>
        <button type="button" class="toggle-eye" id="g360-lock-eye">👁</button>
      </div>
      <button type="submit" class="enter">Entrar</button>
      <div class="err" id="g360-lock-err"></div>
    </form>
  </div>
</div>
<div class="app g360-hidden" id="app">
<aside class="sidebar">
  <div class="brand"><strong>Gestão 360° Ultra</strong><span>Central da Empresa</span></div>
  <button class="side-btn active" data-module="finance"><span class="ico">$</span>Financeiro <span class="badge" id="nav-fin-badge">0</span></button>
  <button class="side-btn" data-module="projects"><span class="ico">◫</span>Projetos &amp; Tempo <span class="badge" id="nav-proj-badge">0</span></button>
  <div class="side-foot"><button class="side-btn" id="g360-lock-btn"><span class="ico">⎋</span>Sair / Bloquear</button></div>
</aside>
<main class="main">
  <header class="topbar">
    <div class="module-title"><b id="top-title">Financeiro</b><span id="top-sub">Painel financeiro completo</span></div>
    <span class="save-pill" id="save-pill" style="display:none"></span>
    <button class="top-btn" id="module-sync" title="Recarregar os dados do servidor">↻ <span class="txt">Atualizar</span></button>
    <button class="top-btn" id="mobile-lock" title="Sair / Bloquear" style="display:none">⎋</button>
  </header>
  <div class="frames"><iframe class="native-frame active" id="frame-finance" title="Financeiro"></iframe><iframe class="native-frame" id="frame-projects" title="Projetos e Tempo"></iframe></div>
  <nav class="bottom-nav"><button class="active" data-module="finance"><span class="ico">$</span><span class="txt">Financeiro</span></button><button data-module="projects"><span class="ico">◫</span><span class="txt">Projetos</span></button></nav>
</main>
</div>

const MODULE_META={finance:{title:'Financeiro',sub:'Painel financeiro completo',frame:'frame-finance',b64:()=>FIN_B64},projects:{title:'Projetos & Tempo',sub:'15 fases, prazos, tarefas e produtividade',frame:'frame-projects',b64:()=>PROJ_B64}};
const LAST_MODULE_KEY='g360:lastModule';
const isServer=()=>location.protocol==='http:'||location.protocol==='https:';
window.G360_STORE={
 async getFinance(key){let v=null;if(location.protocol!=='file:'){try{const r=await fetch('/api/data?key='+encodeURIComponent(key));if(r.ok){const j=await r.json();if(j&&j.value!=null){v=j.value;localStorage.setItem('g360:finance:'+key,v)}}}catch(e){}}if(v==null){try{v=localStorage.getItem('g360:finance:'+key)}catch(e){}}return v==null?null:{value:v}},
 async setFinance(key,value){try{localStorage.setItem('g360:finance:'+key,value)}catch(e){}if(location.protocol!=='file:'){try{await fetch('/api/data',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key,value})})}catch(e){}}return {value}},
 async getKey(key){if(!isServer())return{ok:false,value:null};try{const r=await fetch('/api/data?key='+encodeURIComponent(key),{cache:'no-store'});if(!r.ok)return{ok:false,value:null,status:r.status};const j=await r.json();return{ok:true,value:j?j.value:null}}catch(e){return{ok:false,value:null}}},
 async setKey(key,value){if(!isServer())return{ok:false,offline:true};if(typeof value!=='string')value=JSON.stringify(value);try{const r=await fetch('/api/data',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key,value})});return{ok:r.ok,status:r.status}}catch(e){return{ok:false}}}
};
let currentModule='finance',pillTimer=null;
window.G360_SAVE_STATUS=function(mod,kind,msg){const p=document.getElementById('save-pill');p.style.display='';p.className='save-pill '+kind;p.textContent=(mod==='projects'?'Projetos: ':'')+(kind==='ok'?'✓ ':'⚠ ')+msg;clearTimeout(pillTimer);if(kind==='ok')pillTimer=setTimeout(()=>{p.style.display='none'},3500);setTimeout(refreshBadges,300)};
function decode64(x){const bin=atob(x),arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return new TextDecoder().decode(arr)}
function loadFrame(name,force){const m=MODULE_META[name],f=document.getElementById(m.frame);if(!force&&f.dataset.loaded==='1')return;f.dataset.loaded='1';f.srcdoc=decode64(m.b64());f.addEventListener('load',()=>setTimeout(refreshBadges,800),{once:true})}
function showModule(name){if(!MODULE_META[name])name='finance';currentModule=name;const m=MODULE_META[name];loadFrame(name);document.querySelectorAll('.native-frame').forEach(f=>f.classList.toggle('active',f.id===m.frame));document.querySelectorAll('.side-btn[data-module],.bottom-nav button').forEach(b=>b.classList.toggle('active',b.dataset.module===name));document.getElementById('top-title').textContent=m.title;document.getElementById('top-sub').textContent=m.sub;try{localStorage.setItem(LAST_MODULE_KEY,name)}catch(e){}setTimeout(refreshBadges,500)}
function frameEval(id,expr){try{return document.getElementById(id).contentWindow.eval(expr)}catch(e){return null}}
function txDate(t){return String(t.competencia||t.dataCompetencia||t.data||t.vencimento||'').slice(0,10)}
function norm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim()}
function txPaid(t){return ['pago','recebido','quitado'].includes(norm(t.situacao||t.status||''))||t.pago===true}
function txOpen(t){return !txPaid(t)&&!['cancelado','cancelada'].includes(norm(t.situacao||t.status||''))}
function refreshBadges(){try{let tx=frameEval('frame-finance','typeof tx!=="undefined"?tx:null');if(!Array.isArray(tx)){try{tx=JSON.parse(localStorage.getItem('g360:finance:transacoes')||'[]')}catch(e){tx=[]}}const now=new Date();const overdue=(tx||[]).filter(t=>t.tipo==='Entrada'&&txOpen(t)&&txDate(t)&&new Date(txDate(t)+'T23:59:59')<now).length;document.getElementById('nav-fin-badge').textContent=overdue}catch(e){}
 try{let s=frameEval('frame-projects','typeof state!=="undefined"?state:null');if(!s){try{s=JSON.parse(localStorage.getItem('es_producao_v2')||'null')}catch(e){}}document.getElementById('nav-proj-badge').textContent=((s&&s.projects)||[]).filter(p=>p.status==='active').length}catch(e){}}
document.querySelectorAll('[data-module]').forEach(b=>b.addEventListener('click',()=>showModule(b.dataset.module)));
document.getElementById('module-sync').addEventListener('click',()=>loadFrame(currentModule,true));
document.getElementById('mobile-lock').addEventListener('click',()=>document.getElementById('g360-lock-btn').click());
if(matchMedia('(max-width:760px)').matches)document.getElementById('mobile-lock').style.display='';
let start='finance';try{start=localStorage.getItem(LAST_MODULE_KEY)||'finance'}catch(e){}
showModule(start);
setTimeout(()=>{Object.keys(MODULE_META).forEach(n=>loadFrame(n))},1500);
setInterval(refreshBadges,30000);
</script>

  var CHAVE_SESSAO = 'g360_unlocked';

  function toHex(buffer){
    return Array.prototype.map.call(new Uint8Array(buffer), function(b){ return ('0'+b.toString(16)).slice(-2); }).join('');
  }
  function sha256(texto){
    var enc = new TextEncoder().encode(texto);
    return crypto.subtle.digest('SHA-256', enc).then(toHex);
  }

  var lock = document.getElementById('g360-lock');
  var app = document.getElementById('app');
  var form = document.getElementById('g360-lock-form');
  var input = document.getElementById('g360-lock-input');
  var erro = document.getElementById('g360-lock-err');
  var eye = document.getElementById('g360-lock-eye');
  var lockBtn = document.getElementById('g360-lock-btn');

  function desbloquear(){
    lock.style.display = 'none';
    app.classList.remove('g360-hidden');
  }
  function bloquear(){
    try{ sessionStorage.removeItem(CHAVE_SESSAO); }catch(e){}
    lock.style.display = 'flex';
    app.classList.add('g360-hidden');
    input.value = '';
    erro.textContent = '';
    setTimeout(function(){ input.focus(); }, 50);
  }

  // Sessão liberada enquanto a aba estiver aberta (sessionStorage some ao fechar a aba/janela).
  try{
    if(sessionStorage.getItem(CHAVE_SESSAO) === 'sim') desbloquear();
  }catch(e){}

  form.addEventListener('submit', function(ev){
    ev.preventDefault();
    sha256(input.value).then(function(hash){
      if(hash === HASH_SENHA){
        try{ sessionStorage.setItem(CHAVE_SESSAO, 'sim'); }catch(e){}
        erro.textContent = '';
        desbloquear();
      } else {
        erro.textContent = 'Senha incorreta.';
        input.value = '';
        input.focus();
      }
    });
  });

  eye.addEventListener('click', function(){
    var mostrando = input.type === 'text';
    input.type = mostrando ? 'password' : 'text';
    eye.textContent = mostrando ? '👁' : '🙈';
  });

  if(lockBtn) lockBtn.addEventListener('click', bloquear);
})();
</script>
</body></html>
